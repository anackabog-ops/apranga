[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Ничего не кэшируем «намертво»: сайт правится вручную, имена файлов
# не меняются, поэтому после каждого обновления нужна свежая версия.
# Netlify отдаёт с CDN и сверяется по ETag — быстро и без устаревания.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
